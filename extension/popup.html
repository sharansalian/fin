<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pocket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <!-- ── Auth view ─────────────────────────────────── -->
  <div id="auth-view" class="view">
    <div class="brand">
      <div class="brand-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10l-5 5-5-5V7h2v6.17L12 16l3-3V7h2v6z"/>
        </svg>
      </div>
      <span class="brand-name">Pocket</span>
    </div>
    <p class="auth-tagline">Save articles, read them later.</p>
    <button id="sign-in-btn" class="btn-primary">
      <svg width="16" height="16" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Sign in with Google
    </button>
    <p id="auth-error" class="error-msg" style="display:none"></p>
  </div>

  <!-- ── Save view ──────────────────────────────────── -->
  <div id="save-view" class="view" style="display:none">
    <div class="toolbar">
      <div class="user-info">
        <div class="avatar" id="user-avatar">U</div>
        <span id="user-name" class="user-name"></span>
      </div>
      <button id="sign-out-btn" class="btn-ghost" title="Sign out">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>

    <div class="article-preview">
      <div class="article-domain" id="article-domain"></div>
      <div class="article-title" id="article-title"></div>
    </div>

    <div class="tags-field">
      <label for="tags-input">Tags</label>
      <input
        id="tags-input"
        type="text"
        placeholder="Add tags separated by commas…"
        autocomplete="off"
        spellcheck="false"
      />
    </div>

    <button id="save-btn" class="btn-primary">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10l-5 5-5-5V7h2v6.17L12 16l3-3V7h2v6z"/>
      </svg>
      Save to Pocket
    </button>

    <div id="save-status" class="save-status" style="display:none"></div>
  </div>

  <!-- ── Loading view ───────────────────────────────── -->
  <div id="loading-view" class="view loading-view">
    <div class="spinner"></div>
  </div>

  <script src="popup.bundle.js"></script>
</body>
</html>
