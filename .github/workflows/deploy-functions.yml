name: Deploy Firebase Functions

on:
  push:
    branches:
      - claude/finance-app-sms-scanner-fmkNg
    paths:
      - 'functions/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install function dependencies
        run: npm ci
        working-directory: functions

      - name: Write service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/sa.json

      - name: Authenticate with Google Cloud
        run: gcloud auth activate-service-account --key-file=/tmp/sa.json

      - name: Deploy fetchArticle
        run: |
          gcloud functions deploy fetchArticle \
            --gen2 \
            --runtime=nodejs20 \
            --region=us-central1 \
            --source=functions \
            --entry-point=fetchArticle \
            --trigger-http \
            --allow-unauthenticated \
            --memory=512MiB \
            --timeout=30s \
            --project=finn-2c4c5 \
            --quiet

      - name: Bind GITHUB_TOKEN secret (skip if not configured)
        run: |
          gcloud secrets describe GITHUB_TOKEN --project=finn-2c4c5 > /dev/null 2>&1 \
            && SECRETS_FLAG="--set-secrets=GITHUB_TOKEN=GITHUB_TOKEN:latest" \
            || SECRETS_FLAG=""
          gcloud functions deploy approveSupportRequest \
            --gen2 \
            --runtime=nodejs20 \
            --region=us-central1 \
            --source=functions \
            --entry-point=approveSupportRequest \
            --trigger-http \
            --allow-unauthenticated \
            --project=finn-2c4c5 \
            --quiet \
            $SECRETS_FLAG
