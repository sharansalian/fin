name: Claude Code — Auto-implement task

on:
  issues:
    types: [labeled]
  workflow_dispatch:

jobs:
  claude-task:
    # Only run when the 'claude-task' label is added
    if: github.event.label.name == 'claude-task'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@beta
        env:
          OVERRIDE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          direct_prompt: |
            Implement the feature or bug fix described in this GitHub issue.
            Read the issue title and body carefully, then make the necessary code changes.
            Create a pull request with your implementation when done.
